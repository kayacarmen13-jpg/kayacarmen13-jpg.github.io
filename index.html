 html:`<div class="mag" id="mag"><button class="card feat" data-art="1"><span class="kick">essay</span><b>Faith Does Not Require Sanitization: on Orthodoxy, Dostoevsky’s The Brothers Karamazov, and Gothicism</b><span class="dek2">Faith doesn’t become more intellectually or morally valid when you censor all things disturbing, contradictory, grotesque, or erotic.</span><span class="rd">read →</span></button><button class="card" data-art="2"><span class="kick">essay</span><b>The Piano Teacher’s Bataillean Cannibal Cousin</b><span class="dek2">CANDY APPLE #1. Georges Bataille’s Erotism and the desire to consume your beloved in Claire Denis’ Trouble Every Day (2001). OR: the dangers of not matching someone’s freak.</span><span class="rd">read →</span></button><button class="card" data-art="3"><span class="kick">analysis</span><b>The Rotten Sweetness of Amma Crellin: a Sharp Objects analysis</b><span class="dek2">Saintly sinner or sinning saint? Why are girls so obsessed with dual-personality characters?</span><span class="rd">read →</span></button></div>
<div class="post" id="art1" hidden><p><button class="btn back">← back to editorial</button></p><h3>Faith Does Not Require Sanitization: on Orthodoxy, Dostoevsky’s The Brothers Karamazov, and Gothicism</h3><p class="dek">Faith doesn’t become more intellectually or morally valid when you censor all things disturbing, contradictory, grotesque, or erotic.</p>
<p>I have the sudden urge to express my viewpoint on this specific disease of perpetuating religion as inherently docile and immaculate.</p>
<p>My faith has never been stronger than after reading Ivan’s monologue in The Brothers Karamazov. It’s honest, unflinching, and incredibly dark. It exposes life’s pure horror and professes love for it anyway. Why did it strengthen my faith?</p>
<p>Christianity has never possessed the aesthetic purity some people clearly wish it did.</p>
<p>I would argue that even PURITY as a biblical concept is not the total absence of depravity, but the willingness to rise above it.</p>
<h4>CATHOLICISM, CARPETS, CAMUS</h4>
<p>As a child, I associated Catholicism only with bad carpets and moldy basements. Rooms populated with the scent of mildew and stale coffee. The awful presence of austere authority. The prevalence of mundane suburbanites who only seemed capable of discussing the greenness of their lawns.</p>
<p>I desperately tried to believe myself when I claimed not to believe in anything.</p>
<p>I never wished to believe, because I thought it’d mean more if I was an atheist and was still good. If I had no reason to be kind, no fear of fire and brimstone, no dangled promise of eternal paradise – wouldn’t my morality mean more?</p>
<p>I adored absurdism. I adored Camus because— first of all, he was sexy and had a cat named Cigarette. Second, he noted that everything is permitted, yet whatever actions we define as personally permissible will ultimately define us.</p>
<p>In retrospect, I rejected religion because I thought morality would only be authentic if it was entirely one’s own, not coaxed out of someone under false pretenses.</p>
<p>Plus, in all honesty, I thought atheism was cooler — cigarettes, contrarians, long wool coats, unfiltered discussions, despair. We only got scandals behind closed doors and prudish moralism everywhere else.</p>
<p>I thought religion was a comforting bedtime story for those who couldn’t tolerate life’s gruesome reality.</p>
<p>Looking back, Camus was a comforting bedtime story too. Aren’t they all?</p>
<p>At the end of the day, even the nonchalant absurdist was providing something pure. The literature often considered ‘edgy enough for teenagers’ was in no way evil or corrupting.</p>
<h4>CANDLES, CATHEDRALS, CZECHIA</h4>
<p>Once you live long enough to see the ineffable beauty that lies beyond the church basement, your perception may change.</p>
<p>Now, when I think of Catholicism, I think of weddings in Sicily with lace veils and the honest belief that marriage is the truest manifestation of love. I think of Jim Morrison’s poetry and of arched cathedral ceilings – both too beautiful to comprehend.</p>
<p>I think of Eastern Europe and the idea of suffering as a virtue. I think of candlewax and stained glass. Chiaroscuro paintings depicting the sacred and profane in a shared composition.</p>
<p>I think of Dostoevsky – his ability and willingness to write the character Ivan, a perfect representation of an Absurdist who has no personal purpose for Religion. How beautiful that he was willing to portray an atheist so brilliantly?</p>
<p>I think of Dasha Nekrasova’s wedding.</p>
<p>I think of Kostel svatého Jiří (St. George’s Church) in Luková, Czechia– also known as the church of ghosts. It was abandoned in the ‘60s after a roof collapse was believed to be a bad omen. In 2012, art student Jakub Hadrava installed over thirty plaster ghostlike figures among the wooden pews.</p>
<p>The macabre didn’t desecrate the sacred. Instead, the macabre was a resurrection. Morbid polymer ghosts brought thousands of visitors to a church that was once abandoned. It was beautiful, dark, sad, haunting, hopeful, sweet, true to life.</p>
<p>I still love absurdism, but the sheer beauty of cathedrals gives me a feeling I can’t explain in human terms.</p>
<h4>THE BROTHERS KARAMAZOV</h4>
<p>As a child, religion bored me because I thought it was fundamentally without contradiction, without struggle, without intensity. Everyone religious seemed devoid of problems, thus devoid of philosophical thinking.</p>
<p>My faith has never been stronger than after reading Ivan’s monologue in The Brothers Karamazov. It’s honest, unflinching, and incredibly dark. It exposes life’s pure horror and professes love for it anyway.</p>
<p>When Ivan plainly presents the horrific and senseless suffering of innocent children on God’s earth, Dostoevsky isn’t trying to destroy Christianity. His earnest presentation of valid criticism is a beautiful refusal to sanitize religion.</p>
<p>Dostoevsky gives us potentially the most powerful and well-presented argument against God, and in doing so, he allows the exquisite portrayal of faith, love, Alyosha’s purity, Dmitri’s passion and joie de vivre, Grushenka’s honorable reflection on her past cruelty and newfound desire to be good.</p>
<p>Dostoevsky brought these horrors to the page not to dismantle his faith, but to intensify it. A faith untested by the darkest truths would be hollow; a faith only true under certain pretences. If you can ignore this, if you can forget that.</p>
<p>What’s weaker than a love that refuses to stare into the abyss and love anyway?</p>
<h4>THE DARK ARTS</h4>
<p>Some people perceive morbid artistic expression as a literal pledge to the dark arts. Darkness is intense and interesting, as is light. What’s most compelling is the marriage of both. The bible is a story of love, sacrifice, light, angels, faith, famine, betrayal, tragedy, murder, and martyrs.</p>
<p>Faith isn’t sweeping the grotesque bits of life under a rug to maintain an immaculate illusion. Why would writing a Gothic novel contradict the bible? Art can make the ugly beautiful and the beautiful ugly, which is valuable when reality was probably a mix all along.</p>
<p>Let people be dark in art; it doesn’t mean they’re demonic.</p>
<blockquote>“For me, 666 represents rock and roll, nothing more... It’s just for fun... We are not evil people at all. We are funny and nice people. Yeah, trying to be entertainers, not Satanists.” - Ville Valo</blockquote>
<p>Most of Valo’s songs are deeply romantic love ballads anyway.</p></div>`+`<div class="post" id="art2" hidden><p><button class="btn back">← back to editorial</button></p><h3>The Piano Teacher’s Bataillean Cannibal Cousin</h3><p class="dek">CANDY APPLE #1. Georges Bataille’s Erotism and the desire to consume your beloved in Claire Denis’ Trouble Every Day (2001). OR: the dangers of not matching someone’s freak.</p><p>Candy apple is the name of my new film analysis series. That’s what it’s called because I’m in charge. I will rate the movies out of five candy apples. You will rejoice. It doesn’t have to make sense. I’m the sheriff. As my first act, I abolish the sheriff’s department. This publication is lawless.</p><p>WARNING: THIS FILM MAY INDUCE BLOODLUST, DISTURBING FANTASIES, AND IN EXTREME CASES: ATTRACTION TO VINCENT GALLO.</p><p>content warning: cannibalism, violence, sexual extremity.</p><h4>I. hors-d’œuvre</h4><p>“I love you so much. I could eat you.” Tagline for Trouble Every Day.</p><p>“Eroticism, it may be said, is assenting to life up to the point of death.” Erotism: Death and Sensuality, Georges Bataille.</p><p>Have you ever been in love? Has this love ever plunged you into a reverie so gruesome you could hardly stomach it? Have you ever gazed at your lover and fallen into gory dreams, this time willingly, like pressing on a bruise, an addictive kind of wrong, knotting together pure desire and a fantasized bite to the jugular, blood bursting out of his neck like Kubrick’s elevator?</p><p>Have you ever liked it?</p><h4>II. cannes-ibalism</h4><p>Trouble Every Day and The Piano Teacher both premiered at Cannes in 2001. Two French-ish films which explore sexual transgression, self-destruction, and the potentially violent consequences of romantic love without boundaries. These films are sometimes grouped under the label New French Extremity.</p><p>Haneke’s The Piano Teacher won three big-ticket awards (best actress, best actor, and the grand prix).</p><p>Claire Denis’ Trouble Every Day was instead met with the quintessential screening scandals. Critics booed and stormed out. Two women fainted and required medical attention. I sometimes wonder if festivals fill audiences with people on the brink of heart attacks, just to get good headlines.</p><p>MULTIPLE AUDIENCE MEMBERS LEAVE IN AMBULANCE.</p><p>I’m no American, but I imagine the mere mention of an ambulance is at least fiscally horrifying.</p><p>From a Guardian article published the following day, hilariously titled ‘Cannes audience left open-mouthed’: “Even the French critics booed and walked out.”</p><p>EVEN THE FRENCH? But… the French are supposed to transgress. France produced Georges Bataille…</p><h4>III. amuse bouche</h4><p>The film opens with an original song by Tindersticks. The swelling violins set the tone immediately: romantic and addictive, yet oddly stomach-churning. You feel a gutful of butterflies, tangled nerves preparing you for something.</p><p>Trouble Every Day follows newlyweds Shane and June as they embark on their honeymoon.</p><p>(Shane Brown… What’s Gallo’s obsession with the word brown? Billy Brown? Shane Brown? The Brown Bunny? What a brown noser.)</p><p>Shane has chosen Paris as their honeymoon destination, with the ulterior motive of tracking down an old neuroscience colleague, Leo. Shane wants to discuss some ‘experiments’ which may have had something to do with his snowballing urges to entwine sex and violence.</p><p>Shane’s search proves fruitless. Leo’s too busy trying to keep his wife Coré (Béatrice Dalle) from cannibalizing truckers.</p><p>Shane continues to wrestle with his violent desires, sexually neglecting his wife throughout the film (presumably in order to preserve her life).</p><p>The most gruesome scenes aren’t necessarily the blood-soaked acts of cannibalism, but the hollow hotel room refusals between husband and wife. It’s hard to watch the distance between them grow, an ever-expanding cavern, evidence of their firmly separate entities.</p><h4>IV. main course</h4><p>We endlessly borrow from the vocabulary of consumption when discussing love. You’re delicious. I devour you with my eyes. I could just eat you up.</p><p>In Erotism: Death and Sensuality, Bataille begins with the idea of discontinuity: you and I are separate beings. You are you. I am me.</p><p>No matter how hard we may try to fuse ourselves together, there will always be some immeasurable distance between us. There will always be something that keeps you you and me me.</p><p>Bataille sees eroticism as an attempt to overcome this separation, or at least, to emotionally escape it. Eroticism allows us to temporarily believe that the distance between us can be collapsed.</p><p>We want to convince ourselves we can dissolve back into one, if only for a period of time. You and I can momentarily become us rather than</p><p>you</p><p>and</p><p>i.</p><p>In Trouble Every Day, violent sex serves as a grotesque representation of our desire to breach these boundaries. It’s horrifying, and it’s sexy, both in equal measure, maybe because there’s some truth in either reading. The film suggests that the attempt to overcome our separateness can turn horrific, but so can the attempt to avoid intimacy.</p><p>For Bataille, eroticism and death are entwined because they both threaten the boundaries that otherwise define us as separate beings. Eroticism is a brief release from that separation; death is the final freedom from it.</p><p>We transgress in order to get as close to that release as possible. We imagine ourselves absorbing our lover, or devouring, or being devoured. All of this comes from a desire for undeniable closeness, for a momentary tangible experience that is meaningful enough to point to our subjective feelings of love. Look, there is no room left between us.</p><p>The Piano Teacher serves as a compelling counterpoint. The film displays the dangers of sexual love as a method of orchestrating self-punishment.</p><p>Erika Kohut craves transgression as a release from the monotonous pain of her life, and unfortunately, she meets Walter, who is willing to give her that transgression.</p><p>It could be argued that Trouble Every Day presents the same thesis: romantic love pushed one step too far, until appetite melts into sheer violence.</p><p>However, the film is also a twisted warning of the opposite. Repressing and sanitizing one’s desires so as never to degrade or harm the lover results in an empty, hollow violence instead. Neglect, silence, denial of appetite or passion. An unwillingness to close the space between you and your lover, for fear of never coming back.</p><h4>V. dessert</h4><p>Trouble Every Day is as delicious as it is disgusting.</p><p>I can’t help but adore it. It gets under your skin. It explores a sickeningly sweet, nearly banal relationship against a backdrop of sexual transgression. The newlyweds’ scenes stand out as the true horror within a runtime full of cannibalism, murder, and sexual aggression.</p><p>Beneath litres of blood, this film explores a horrifically human desire: to love and be loved so hard that the distinction between you and your lover ceases to exist.</p><p>Like in Bataille’s work, lovers can’t literally escape their separateness, but eroticism offers a brief reprieve from it, a mutual illusion of continuity.</p><p>Five candy apples.</p></div>
<div class="post" id="art3" hidden><p><button class="btn back">← back to editorial</button></p><h3>The Rotten Sweetness of Amma Crellin: a Sharp Objects analysis</h3><p class="dek">Saintly sinner or sinning saint? Why are girls so obsessed with dual-personality characters?</p><p>Why do girls worship two-faced sinner-saints like Amma Crellin — and why are we crucified for it, while men are free to idolize Tony Soprano?</p><p>SPOILER ALERT FOR SHARP OBJECTS.</p><p>WATCH / READ IT IF YOU HAVEN’T.</p><p>IT’S WORTH IT. PROMISE.</p><p>table of contents:</p><ul><li>If you let people do things to you, you’re really doing it to them — a masochistic reading of Sharp Objects</li><li>Girls made of contradictions: the virgin-whore / sinner-saint.</li><li>I contain multitudes — the importance of anti-heroes in media.</li><li>A motherly &amp; monstrous reading of Sharp Objects</li><li>Rotten and sugary all at once</li></ul><h4>1. If you let people do things to you, you’re really doing it to them — a masochistic reading of Sharp Objects.</h4><p>I underlined it in pink pen — my wrist descending onto the page with so much force it nearly tore a cavern straight through.</p><blockquote>“Sometimes if you let people do things to you, you’re really doing it to them. Know what I mean? If someone wants to do fucked-up things to you, and you let them, you’re making them more fucked up. Then you have the control.”<br>— Amma Crellin in Gillian Flynn’s Sharp Objects</blockquote><p>This is my favorite quote of the novel. I felt like it somehow spewed from my innards.</p><p>All hail Gillian Flynn — the truth was visible from the start, but we didn’t yet have the context to fully understand it.</p><h4>2. Girls made of contradictions: the virgin-whore / sinner-saint.</h4><p>I think it’s cowardly to suggest that the Madonna-Whore complex is nothing more than a psychological dysfunction: a few wires crossed, a mother who loved her son too much or not enough.</p><p>Rather, I think the concept connects to a broader issue, not a feminist one or a psychiatric one but an institutionally popularized inability (or unwillingness) to properly recognize life’s often brutal duality.</p><p>Amma Crellin is a honey-blonde adolescent whose closet consists of floral sweetheart neckline dresses and frilly cardigans… she spends her time roller-skating and meticulously tending to her dollhouse. She is obedient, sweet, feminine. A stark contrast to Camille Preaker, Amma seems to be in constant need of motherly love and care.</p><p>Amma Crellin is a manipulative sadist who upon sneaking out at night, easily slips into the role of the promiscuous, popular, perfect girl. The lifelong abuse she suffered at the hands of her mother led her to possess such a distorted view of care that in her eyes LOVE is permanently entwined with HARM… she steals liquor from gas stations, she tongues tabs of MDMA and rides in cars with older boys, she takes pleasure in twisting knives deeper and deeper (whether physical or verbal).</p><p>The second paragraph doesn’t negate the first. These statements all remain true.</p><p>People instinctively want to believe in the concept of a false and true self — it’d be easier that way. This would mean Amma was merely wearing a mask all along, fully and falsely sweet on the outside, fully and truly evil underneath. I just don’t believe this is true, or at least, I don’t believe it’s as interesting.</p><p>This is the same reason Twin Peaks’ Laura Palmer is (and always will be) so captivating, to me and to everyone else who has her picture framed throughout their homes.</p><p>In fact, this doesn’t solely apply just to Laura herself, but Lynch’s work on the whole — splendid suburbia tainted by severed ears and prom queens washed up on the shore, idyllic diners and rapist fathers. Lynch was able to see life’s lovely peaks and putrid valleys. Life is heaven and hell unravelled upon itself. Any one thing is never one thing.</p><p>Girls latch onto characters like Laura Palmer, and more extremely, Amma Crellin, precisely because we long to see depictions of girls who are built on contradictions.</p><h4>3. I contain multitudes - the importance of anti-heroes in media</h4><blockquote>“Mad men, Don Draper, Breaking Bad, Tony Soprano, you never hear ‘is he likeable enough?’ that is only thrown out about women. The question is not likeable, the question is compelling.”<br>- Gillian Flynn — panel discussion about Sharp Objects.</blockquote><p>Women are attracted to contradictory female characters because cultural society endlessly insists that we fall into moral simplicity — whereas men are permitted multiplicity.</p><p>This isn’t a solitary opinion. The lead actress of the revered and contentious ‘Sex and the City’ echoes this sentiment:</p><blockquote>“A male lead on a show can be a murderer, and people love him. (…) If a woman has an affair, behaves poorly, or spends money foolishly (…) there’s a kind of punitive response to it.”<br>— Sarah Jessica Parker</blockquote><p>I think the issue lies in the fact that we seem to hold more space for the spectrum of a man. Even in real life — your husband got beers with the guys instead of celebrating your fourth wedding anniversary? He’s still an incredible husband… what’s precious about FOUR anyway? Five is what matters. He’s funny and handsome and makes a lot of money, he just isn’t sentimental.</p><blockquote>“We all know women who are bad. And it’s extraordinarily dangerous and actually misogynous to represent only women who are good. Because that puts us in this very small and constricting box. I believe very strongly that women should be portrayed in all the variations that exist.”<br>— Gillian Flynn</blockquote><p>Ironically, in readings of Flynn’s work, people are still holding onto these constricting boxes, grasping onto the idea of strict goodness and badness… so much so that a character wholly rooted in duality and contradictions is believed, at the end of the day, only to be one side of herself — the ‘true’ side — anything else may as well never have happened at all.</p><p>I loved Gone Girl because it wasn’t just a depiction of some doting wife turned evil OR some evil wife pretending to be doting, Amy Dunne had intensely negative traits, to say the least.</p><p>She was also a wonderful writer, an incredibly intelligent and determined person… and above all, a ridiculously compelling character.</p><p>Say what you will, but, again, because I find this to be a more interesting reading, I BELIEVE some of Diary Amy’s truth. I believe she loved Nick and was willing to try to be the cool girl he wanted. I believe that she was young, lovesick, hopeful, and made up of chemistry which, when met with her specific life experiences, gave way to the conniving and cruel Amy from the latter half of the book.</p><p>I could just as easily have written an essay about Camille Preaker, Adora Crellin, Jackie. These characters make us feel something — they’re feminine, wrong, raw, messy, caring, destructive, FLAWED.</p><p>At her core, Amma Crellin is a picture-perfect model of the worst, most rotten manifestation of the dual-personality. Laura Palmer, conversely, is a patron-saint: a tragic, more angelic representation (though not devoid of flaws and cruelties).</p><p>We NEED these dual-personality characters for the same reason we need anti-heroes. As simple as it sounds, we need to see our own wretched-and-wonderful mix of human flaws and strengths reflected.</p><h4>4. A motherly and monstrous reading</h4><p>On my first reading of Sharp Objects, I believed Amma was the killer.</p><p>You could argue that this should’ve made me dislike her, should’ve made me categorize everything she said as inhuman, cruel, manipulative, therefore I should’ve discounted it completely… though in all honesty, I’m not horrifically weighed down by the pursuit of prosecuting fictional characters as though they are real.</p><p>The line stood out to me as purely human, maybe the one instance up to that point where Amma was being honest.</p><blockquote>“Sometimes if you let people do things to you, you’re really doing it to them. Know what I mean? If someone wants to do fucked-up things to you, and you let them, you’re making them more fucked up. Then you have the control.”</blockquote><p>Upon finishing the book and the HBO show, adoring them both, and spending months stewing in the miserable / elated post-binge obsession — I revisited the quote and I was amazed at how simple my new understanding of it was.</p><p>Amma was never talking about boys, she was talking about her mother.</p><p>Until the unravelling at the end of Sharp Objects, Camille didn’t understand the full truth of what Adora had done (to her, to her sister, to Amma). Munchausen by proxy, poison administered as medicinal care-taking.</p><p>Adora was desperate for her children to need her, desperate to play the role of angelic all-knowing loving mother. She made them sick on purpose. She killed Marian.</p><p>Marian didn’t know about the poison and accepted it, innocently trusting that her mother was caring for her.</p><p>Camille didn’t know about the poison and rejected it, possibly instinctively.</p><p>Amma knew all along that her mother was poisoning her. She went along with the cruelty, succumbed to the abuse, because it allowed her to externalize her own evil.</p><p>Amma let her mother poison her because it meant she was no longer the real monster.</p><p>I’m not justifying Amma, I’m justifying why Amma justifies Amma. The distinction between someone like Amma and someone like Laura Palmer is the breaking or perpetuation of the abusive cycle. Amma is a cautionary and horrific tale: the child who absorbs her mother’s cruelty and bestows it on further victims. Laura, while just as tragic, is a figure of pure hope and love for so many people, precisely because she did just the opposite. No matter how evil she felt, she never allowed Bob in, never allowed herself to hurt someone else the way she was hurt.</p><h4>5. Conclusion — Rotten and Sugary all at once</h4><p>We’re all two-faced virgin-whores. In the right room I’d be a saint, in the wrong one I’d be perceived as the worst girl on earth.</p><p>I used to hate Courtney Love because I loved Kurt Cobain, and I thought that meant she deserved my scorn. Kurt Cobain did heroin because he was a moody artist, fated for tragedy from the start. Courtney did heroin because she was a mess. God, she had a daughter — how could she do that? As if a child doesn’t take two.</p><p>Now, I think Courtney is brilliant, cool, funny, artistic, authentic, insightful, and wrongfully blamed for an event she suffered worse than we did.</p><p>What changed? Maybe I grew enough as a person that now I can wrap my head around the wonderful sweetness and awful cruelties that make up a woman?</p><p>We’ve been spoon-fed anti-hero men for long enough that we’ve adapted to the bittersweet taste. All I’m asking is that we start to do the same with female characters.</p><p>I don’t excuse anything that Amma did, of course not! She was a cruel and sick person, as was her mother. Camille was good ish, but not perfect either. This is what I adore about Sharp Objects. It’s REAL, it gets under your skin, it confronts you with the possibility that there are no purely good people.</p><blockquote>There are no good women in Sharp Objects. Camille, my narrator of whom I’m obsessively fond — she’s witty, self-aware, and buoyant — is the closest to good. And she uses booze, sex, and scissors to get through the day.<br>— Gillian Flynn, ‘I Was Not a Nice Little Girl…’</blockquote><p>Even Ann Nash and Natalie Keene are not perfect victims. They were violent. This is important too. We aren’t grieving them because they were sweet angels who everyone loved, we are grieving them because they were murdered, and they deserve to be grieved nonetheless.</p><blockquote>“As for the murdered little girls, I didn’t want these doomed girls to be just flashes of dimples and hair ribbons. That would be too easy... The murdered girls of Sharp Objects aren’t doll-like victims; they have vicious streaks themselves; they were fighters.”<br>— Gillian Flynn, ‘I Was Not a Nice Little Girl…’</blockquote><p>Gillian Flynn’s Sharp Objects is an unflinching portrayal of life’s bittersweet reality: beauty and rot are never found without the other pounding at its door.</p><p>Women, just like life, can be rotten and sugary and hard and sweet and cruel and funny and loving and tragic all at once. The most charitable thing Gillian Flynn could do was write a book devoid of ‘good women’.</p></div>`

hic small-town mystery that’s as much about narrative, language, and philosophy, as it is about serial killers.</p><p>I’m completing a BA in Creative Writing at Concordia University, where I also write for student literary magazine and host a weekly radio show. I previously studied Law and Film at Algonquin College. I’m interested in a wide variety of disciplines and industries, which is part of the reason I adore writing. I rejoice at the chance to try on other lives, perspectives, and personalities.</p><div style="clear:both"></div>`},

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function typeInto(el,text,ms){
  const cur=document.createElement('span');cur.className='cur';el.textContent='';
  if(reduce){el.textContent=text;return}
  el.appendChild(cur);
  for(const ch of text){cur.before(ch);await sleep(ms)}
  setTimeout(()=>cur.remove(),1800);
}
let z=60,n=0;
function open(id){
  let w=document.getElementById('w-'+id);
  const d=WIN[id];
  if(!w){
    w=document.createElement('section');w.id='w-'+id;w.className='win';w.setAttribute('role','dialog');w.setAttribute('aria-label',d.tab);
    w.innerHTML=`<div class="bar"><div class="dots"><button class="c" aria-label="Close"></button><button class="y" aria-label="Minimize"></button><button class="g" aria-label="Zoom"></button></div><span class="tab">${d.tab}</span></div>
    <div class="addr"><div><em>♡</em> <span class="u"></span></div></div>
    <div class="body"><h2></h2><p class="sub">${d.sub}</p>${d.html}</div>`;
    document.body.appendChild(w);
    const k=n++%6;w.style.left=`calc(50% - 320px + ${k*34-80}px)`;w.style.top=(70+k*30)+'px';
    if(innerWidth<680)w.style.left='';
    w.querySelector('.c').onclick=()=>{w.classList.remove('on')};
    w.querySelector('.y').onclick=()=>{w.classList.remove('on')};
    w.querySelector('.g').onclick=()=>{if(!mobile()){w.style.left='4vw';w.style.top='44px';w.style.width='92vw'}};
    drag(w);
    w.addEventListener('pointerdown',()=>w.style.zIndex=++z);
  }
  w.classList.remove('on');void w.offsetWidth;w.classList.add('on');w.style.zIndex=++z;
  typeInto(w.querySelector('.u'),d.url,35);
  setTimeout(()=>typeInto(w.querySelector('h2'),d.h,55),250);
  w.querySelector('.c').focus({preventScroll:true});
  if(id==='watch')setTimeout(runDemo,1000);
}
function drag(w){
  const bar=w.querySelector('.bar');
  bar.addEventListener('pointerdown',e=>{
    if(mobile()||e.target.closest('button'))return;
    const r=w.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;
    bar.setPointerCapture(e.pointerId);bar.style.cursor='grabbing';
    const mv=ev=>{w.style.left=Math.max(0,Math.min(innerWidth-120,ev.clientX-dx))+'px';w.style.top=Math.max(30,Math.min(innerHeight-60,ev.clientY-dy))+'px'};
    const up=()=>{bar.style.cursor='';bar.removeEventListener('pointermove',mv);bar.removeEventListener('pointerup',up)};
    bar.addEventListener('pointermove',mv);bar.addEventListener('pointerup',up);
  });
}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.open)));

document.addEventListener('submit',e=>{
  const f=e.target;if(f.id!=='inq')return;e.preventDefault();
  const d=new FormData(f),note=f.querySelector('.note');
  if(!EMAIL){note.textContent='email address not set yet.';return}
  const subj='Inquiry: '+d.get('t');
  const body=d.get('m')+'\n\n'+d.get('n')+' ('+d.get('e')+')';
  location.href='mailto:'+EMAIL+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
});

function blip(){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=330+Math.random()*220;g.gain.setValueAtTime(.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0005,ac.currentTime+.06);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.07)}catch(e){}}
$('#snd').addEventListener('click',e=>{soundOn=!soundOn;e.target.textContent=soundOn?'♪ on':'♪ off';e.target.setAttribute('aria-pressed',soundOn);if(soundOn)blip()});
const pal=document.createElement('div');pal.id='pal';pal.setAttribute('role','status');pal.setAttribute('aria-live','polite');document.body.appendChild(pal);
function palShow(noX){pal.innerHTML=`<img class="fw" src="${FAWN}" alt=""><div class="bub"><div class="nt"><span>${HNAME}.exe</span>${noX?'':'<button class="x" aria-label="Close">✕</button>'}</div><div class="tx"></div></div>`;pal.style.display='flex';const x=pal.querySelector('.x');if(x)x.onclick=palClose}
function palHide(){pal.style.display='none';pal.innerHTML=''}
const askBtn=document.createElement('button');askBtn.id='ask';askBtn.hidden=true;
askBtn.innerHTML=`<img src="${FAWN}" alt="" width="16"> Ask ${HNAME} about Kaya’s experience`;
document.body.appendChild(askBtn);
function showAsk(){askBtn.hidden=false}function hideAsk(){askBtn.hidden=true}
const QA=[
 {q:'What does she write?',a:'Editorial-minded copy and SEO content for brands with a point of view, like beauty, fashion, culture and travel. She also has B2B experience, writes fiction, and likes UX writing.'},
 {q:'Where has she worked?',a:'She is a copywriter at Wordplay Creative. Before that: hospitality, administration, film production and content writing, including an administrative apprenticeship in a sales office.'},
 {q:'What has she studied?',a:'Creative Writing, Literature and Philosophy at Concordia University. Before that, Law Clerk & Administration and Film & Media Production at Algonquin College.'},
 {q:'Which tools does she use?',a:'Figma, Canva, CapCut, the Adobe Suite, Excel and Google Sheets.'},
 {q:'Does she edit manuscripts?',a:'Manuscript editing and ghostwriting are on her list too. Ask her about it.'}
];
function choices(tx,items){const box=document.createElement('div');box.className='pb qs';items.forEach(([l,f,alt])=>{const b=document.createElement('button');b.className='btn'+(alt?' no':'');b.textContent=l;b.onclick=f;box.appendChild(b)});tx.appendChild(box)}
function palClose(){palHide();showAsk()}
function palHire(){palHide();showAsk();open('contact')}
async function qaMenu(){
  hideAsk();if(pal.style.display!=='flex')palShow();
  const tx=pal.querySelector('.tx');tx.innerHTML='';
  await acType(tx,'What would you like to know?');
  choices(tx,[...QA.map((x,i)=>[x.q,()=>qaAnswer(i)]),['work with Kaya',palHire],['bye',palClose,1]]);
}
async function qaAnswer(i){
  const tx=pal.querySelector('.tx');tx.innerHTML='';
  await acType(tx,QA[i].a);
  choices(tx,[['ask something else',qaMenu],['work with Kaya',palHire],['bye',palClose,1]]);
}
askBtn.onclick=qaMenu;
async function acType(el,html){
  el.innerHTML=html;
  const ns=[],tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  while(tw.nextNode())ns.push([tw.currentNode,tw.currentNode.textContent]);
  if(reduce)return;
  ns.forEach(([n])=>n.textContent='');
  for(const [n,t] of ns){for(const ch of t){n.textContent+=ch;if(ch!==' ')blip();await sleep('.!?'.includes(ch)?320:ch===','?160:38)}}
}
function mkCursor(){const cu=document.createElement('div');cu.id='kc';cu.innerHTML='<svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 2l15 8-6.5 2L8 18z" fill="#b3122e" stroke="#fff" stroke-width="1.5"/></svg><b>Kaya</b>';document.body.appendChild(cu);return cu}
function cuTo(cu,pt,ms){cu.style.transition=reduce?'none':`transform ${ms}ms ease-in-out`;cu.style.transform=`translate(${pt[0]}px,${pt[1]}px)`}
function ptOf(el,right){const rs=el.getClientRects(),r=right?rs[rs.length-1]:rs[0];return [right?r.right:r.left,r.top+r.height*.3]}
const DEMO={before:'Our platform leverages innovative solutions to facilitate payment processing for businesses of all sizes.',edits:[{find:'leverages innovative solutions to facilitate payment processing for',to:'helps'},{find:'.',to:' get paid.'}]};
let demoRun=0;
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
async function runDemo(){
  const my=++demoRun,w=$('#w-watch'),p=w.querySelector('#demo'),st=w.querySelector('#st');
  const alive=()=>my===demoRun&&w.classList.contains('on');
  let txt=DEMO.before;p.textContent=txt;st.textContent='Kaya is editing…';
  await sleep(900);if(!alive())return;
  const cu=mkCursor(),wr=w.getBoundingClientRect();
  cu.style.transform=`translate(${wr.right-40}px,${wr.bottom-60}px)`;void cu.offsetWidth;
  for(const e of DEMO.edits){
    const i=txt.indexOf(e.find),pre=txt.slice(0,i),post=txt.slice(i+e.find.length);
    p.innerHTML=esc(pre)+'<mark>'+esc(e.find)+'</mark>'+esc(post);
    const m=p.querySelector('mark');
    cuTo(cu,ptOf(m),1100);await sleep(1300);if(!alive()){cu.remove();return}
    m.classList.add('sel');cuTo(cu,ptOf(m,true),600);await sleep(1000);if(!alive()){cu.remove();return}
    m.classList.remove('sel');m.textContent='\u200b';await sleep(500);
    for(const ch of e.to){if(!alive()){cu.remove();return}m.textContent=m.textContent.replace('\u200b','')+ch;cuTo(cu,ptOf(m,true),60);await sleep(80)}
    txt=pre+e.to+post;await sleep(700);
  }
  p.textContent=txt;st.textContent='All changes saved';
  cu.style.transition='transform 1s ease-in,opacity 1s';cu.style.transform=`translate(${wr.right}px,${wr.top-40}px)`;cu.style.opacity=0;
  await sleep(1100);cu.remove();
}
document.addEventListener('click',e=>{if(e.target.id==='replay')runDemo()});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-art]');
  if(b){const w=b.closest('.body');w.querySelector('.mag').hidden=true;w.querySelector('#art'+b.dataset.art).hidden=false;w.scrollTop=0;return}
  if(e.target.closest('.back')){const w=e.target.closest('.body');w.querySelectorAll('.post').forEach(x=>x.hidden=true);w.querySelector('.mag').hidden=false;w.scrollTop=0}
});
async function sticky(){
  const st=document.createElement('div');st.id='sticky';
  st.innerHTML='<button class="sx" aria-label="Dismiss">✕</button><b>WEATHER WARNING:</b><p>If you don’t hire Kaya Carmen, severe blizzards <span id="sw">may begin to</span> plague the nation.</p>';
  document.body.appendChild(st);st.querySelector('.sx').onclick=()=>st.remove();
  setTimeout(()=>{st.style.transition='opacity .6s';st.style.opacity=0;setTimeout(()=>st.remove(),600)},30000);
  await sleep(2400);if(!st.isConnected)return;
  const w=$('#sw'),cu=mkCursor();
  cu.style.transform=`translate(${innerWidth+20}px,${innerHeight*.35}px)`;void cu.offsetWidth;
  cuTo(cu,ptOf(w),1200);await sleep(1400);if(!st.isConnected){cu.remove();return}
  w.classList.add('sel');cuTo(cu,ptOf(w,true),500);await sleep(1000);
  w.classList.remove('sel');w.textContent='\u200b';await sleep(500);
  for(const ch of 'will undoubtedly'){if(!st.isConnected){cu.remove();return}w.textContent=w.textContent.replace('\u200b','')+ch;cuTo(cu,ptOf(w,true),60);await sleep(75)}
  await sleep(900);
  cu.style.transition='transform 1s ease-in,opacity 1s';cu.style.transform=`translate(${innerWidth+40}px,${innerHeight*.2}px)`;cu.style.opacity=0;
  await sleep(1100);cu.remove();
}
async function intro(){
  palShow(true);
  const tx=pal.querySelector('.tx');
  await acType(tx,'I heard you’re looking for a writer. Kaya’s <span id="g">great</span>. She never makes any typo<span id="z">z</span>.');
  tx.insertAdjacentHTML('beforeend','<span class="dn">_</span>');
  await sleep(1200);tx.querySelector('.dn').remove();
  const cu=mkCursor(),z=$('#z'),g=$('#g');
  cu.style.transform=`translate(${innerWidth*.55}px,${innerHeight*.35}px)`;void cu.offsetWidth;
  cuTo(cu,ptOf(z),1300);await sleep(1500);
  z.classList.add('sel');await sleep(800);
  z.textContent='\u200b';z.classList.remove('sel');await sleep(500);
  z.textContent='s';cuTo(cu,ptOf(z,true),150);await sleep(900);
  cuTo(cu,ptOf(g),900);await sleep(1100);
  g.classList.add('sel');await sleep(800);
  g.textContent='\u200b';g.classList.remove('sel');await sleep(500);
  for(const ch of 'excellent'){g.textContent=g.textContent.replace('\u200b','')+ch;cuTo(cu,ptOf(g,true),60);blip();await sleep(85)}
  await sleep(900);
  cu.style.transition='transform 1s ease-in,opacity 1s';cu.style.transform=`translate(${innerWidth+40}px,${innerHeight*.2}px)`;cu.style.opacity=0;
  await sleep(1100);cu.remove();await sleep(1800);palHide();showAsk();setTimeout(sticky,2500);
}
setTimeout(intro,2200);
</script>
</body>
</html>
