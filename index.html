@keyframes fadein{0%{filter:brightness(0) blur(3px) saturate(.5)}45%{filter:brightness(.55) blur(1.2px) saturate(1.5) hue-rotate(-10deg)}75%{filter:brightness(.9) blur(.4px) saturate(1.2)}100%{filter:none}}
#menu{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:30px;background:var(--bar);display:flex;align-items:center;gap:18px;padding:0 14px;font:22px/1 var(--sys);z-index:900;border-bottom:1px solid #f3b5d9}
#menu b{letter-spacing:.5px}#menu .sp{flex:1}
#menu button{background:none;border:0;padding:0;font:inherit;text-decoration:underline;text-decoration-style:wavy;text-underline-offset:3px;text-decoration-color:var(--cherry)}
.col{position:fixed;top:56px;display:flex;flex-direction:column;gap:22px;z-index:5}
.col.l{left:18px}.col.r{right:18px}
.ico{width:112px;background:none;border:0;padding:4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ico i{font-style:normal;font-size:54px;line-height:1;filter:drop-shadow(0 3px 0 rgba(255,255,255,.6)) drop-shadow(0 4px 6px rgba(60,0,30,.5))}
.ico span{color:#fff;font:21px/1 var(--sys);text-shadow:0 0 3px #7a1d4f,0 1px 6px #7a1d4f,1px 1px 0 #7a1d4f;word-break:break-word}
.ico:hover span,.ico:focus-visible span{background:var(--cherry);text-shadow:none}
.win{position:fixed;display:none;flex-direction:column;width:min(640px,92vw);max-height:calc(100vh - 80px);background:var(--lard);border:2px solid var(--plum);border-radius:14px;box-shadow:6px 6px 0 var(--plum),0 0 0 4px var(--bub);overflow:hidden;z-index:50}
.win.on{display:flex;animation:pop .35s steps(5)}
@keyframes pop{0%{transform:scale(.86,.05);filter:brightness(2) hue-rotate(40deg)}60%{transform:scale(1.02,1)}100%{transform:none}}
.bar{background:var(--bub);padding:9px 12px 0;cursor:grab;touch-action:none;user-select:none}
.dots{display:flex;gap:7px;float:left;margin:6px 12px 0 0}
.dots button{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--plum);padding:0}
.dots .c{background:var(--cherry)}.dots .y{background:#ffd86b}.dots .g{background:#8fd694}
.tab{display:inline-block;background:var(--lard);border:2px solid var(--plum);border-bottom:0;border-radius:10px 10px 0 0;padding:3px 16px;font:21px/1.1 var(--sys);margin-left:6px}
.addr{background:var(--lard);border-bottom:2px solid var(--plum);padding:7px 12px}
.addr div{background:#fff;border:2px solid var(--plum);border-radius:99px;padding:2px 14px;font:21px/1.2 var(--sys);color:var(--bruise);min-height:30px;white-space:nowrap;overflow:hidden}
.addr em{font-style:normal;color:var(--cherry)}
.body{overflow:auto;padding:22px 26px 28px;line-height:1.55;font-size:17px;background:var(--lard)}
.body h2{font:400 clamp(44px,9vw,64px)/1 var(--script);margin:0 0 8px;color:var(--cherry);text-shadow:1px 0 #7fe3ff66,-1px 0 #ff5fa866;min-height:1em}
.cur{display:inline-block;width:.55em;height:.9em;background:var(--cherry);vertical-align:-.1em;margin-left:2px;animation:bl 1s steps(1) infinite}
.body h2 .cur{width:3px;height:.7em}
@keyframes bl{50%{opacity:0}}
.sub{font:22px/1.2 var(--sys);color:var(--bruise);margin:0 0 18px}
.row{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;padding:12px 0;border-top:1.5px dashed var(--bruise);text-decoration:none;color:inherit}
.row:hover{background:var(--bub)}
.row i{grid-row:span 2;font-style:normal;font-size:26px}
.row b{font-weight:700}.row small{font:20px/1.1 var(--sys);color:var(--bruise)}
.ph{border:2px dashed var(--cherry);border-radius:10px;padding:16px;margin:12px 0;font:21px/1.2 var(--sys);color:var(--cherry);background:#fff7fb}
.tags span{display:inline-block;background:var(--cherry);color:#fff;font:20px/1 var(--sys);padding:4px 10px;border-radius:99px;margin:0 6px 6px 0}
.btn{cursor:pointer;display:inline-block;background:var(--cherry);color:#fff;border:2px solid var(--plum);box-shadow:3px 3px 0 var(--plum);padding:6px 16px;font:23px/1.2 var(--sys);text-decoration:none;border-radius:8px}
#vhs{position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(40,0,30,.14) 0 1px,transparent 1px 3px)}
#vhs::after{content:"";position:absolute;left:0;right:0;height:14%;top:-14%;background:linear-gradient(transparent,rgba(255,255,255,.1),transparent);animation:roll 7s linear infinite}
@keyframes roll{to{top:110%}}
#boot{position:fixed;inset:0;background:#120610;z-index:1000;color:#fff;font:30px/1 var(--sys);display:flex;align-items:center;justify-content:center;transition:opacity .25s steps(3);cursor:pointer}
#boot.off{opacity:0;pointer-events:none}
#boot .tl{position:absolute;top:22px;left:26px;text-shadow:2px 0 #ff5fa8,-2px 0 #7fe3ff}
#boot .bl{position:absolute;bottom:22px;left:26px;color:#ff9fcf}
#boot .ct{font:400 clamp(54px,12vw,120px)/1 var(--script);text-shadow:3px 0 #ff5fa8,-3px 0 #7fe3ff}
#boot .cur{background:#fff;width:4px}
#boot::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 4px);animation:jit .2s steps(2) infinite}
@keyframes jit{50%{transform:translateY(2px)}}
.dock{position:fixed;top:38px;left:0;right:0;display:flex;justify-content:center;align-items:flex-start;gap:clamp(10px,2.4vw,40px);flex-wrap:wrap;z-index:5;padding:0 12px}
.dock .ico{width:auto;min-width:84px;padding:2px}
.dock .ico i{font-size:40px}
.dock .ico span{font-size:20px;white-space:nowrap}
.inq label{display:block;font:21px/1.2 var(--sys);margin:10px 0 0;color:var(--bruise)}
.inq input,.inq select,.inq textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:2px solid var(--plum);border-radius:8px;background:#fff;font:16px/1.4 var(--body);color:var(--plum)}
.inq .btn{margin-top:14px;cursor:pointer}
.inq .note{display:block;margin-top:8px;font:19px/1.2 var(--sys);color:var(--bruise)}
#pal{position:fixed;right:16px;bottom:16px;z-index:880;display:none;align-items:flex-end;flex-direction:row-reverse;gap:4px}
#pal .fw{animation:bob 2.2s ease-in-out infinite;flex:none}
@keyframes bob{50%{transform:translateY(-5px)}}
.bub{position:relative;max-width:min(290px,calc(100vw - 110px));background:#fff;border:2px solid var(--plum);border-radius:14px;padding:12px 14px;box-shadow:4px 4px 0 var(--plum);font-size:16px;line-height:1.45;margin-bottom:34px;animation:pop .3s steps(4)}
.bub::after{content:"";position:absolute;right:-9px;bottom:14px;width:14px;height:14px;background:#fff;border-right:2px solid var(--plum);border-top:2px solid var(--plum);transform:rotate(45deg)}
.bub p{margin:0 0 8px}
.pb .btn{font-size:19px;padding:3px 12px;margin:2px 6px 0 0}
.pb .no{background:#fff;color:var(--plum)}
.sel{background:#ff9fcf}
#kc{position:fixed;left:0;top:0;z-index:895;pointer-events:none}
#kc b{position:absolute;left:16px;top:16px;background:var(--cherry);color:#fff;font:18px/1.1 var(--sys);padding:1px 7px;border-radius:4px;white-space:nowrap}
.ask{position:absolute;inset:0;background:rgba(61,21,48,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.ask[hidden]{display:none}
.abox{background:var(--lard);border:2px solid var(--plum);border-radius:12px;padding:18px 20px;box-shadow:4px 4px 0 var(--plum);max-width:380px;font-size:17px;line-height:1.5}
.abox p{margin:0 0 6px}.abox .btn{margin:8px 8px 0 0;font-size:20px}
.abox .out{background:#fff;color:var(--plum)}
.bub{border-radius:22px;border-width:3px;margin-top:16px;width:min(290px,calc(100vw - 130px));max-width:none}
.bub .nt{position:absolute;top:-17px;left:16px;background:var(--cherry);color:#fff;border:2px solid var(--plum);border-radius:99px;padding:0 14px;font:20px/1.3 var(--sys)}
.bub .tx{min-height:5.8em}
#pal .fw{width:104px;height:auto}
.dn{display:inline-block;margin-left:6px;color:var(--cherry);animation:dn .7s steps(2) infinite}
@keyframes dn{50%{transform:translateY(3px)}}
.docwrap{background:#ffe6f3;border:2px solid var(--plum);border-radius:10px;padding:12px}
.pres{display:flex;align-items:center;gap:8px;font:20px/1 var(--sys);color:var(--bruise);margin-bottom:10px}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--cherry);color:#fff;font:18px/1 var(--sys)}
.paper{background:#fff;border:1.5px solid #e5bcd3;padding:28px 30px;min-height:150px;font:20px/1.6 var(--body);box-shadow:3px 3px 0 var(--bub)}
.paper p{margin:0}.paper mark{background:none;color:inherit}
.docwrap .btn{margin-top:12px;font-size:20px}
.post h3{font:700 22px/1.25 var(--body);margin:0 0 6px}
.post .dek{font-style:italic;color:var(--bruise);margin:0 0 16px}
.post h4{font:700 15px/1.2 var(--body);letter-spacing:.08em;color:var(--cherry);margin:26px 0 8px}
.post p{margin:0 0 12px}
.post blockquote{border-left:3px solid var(--cherry);margin:14px 0;padding:2px 14px;color:var(--bruise)}

<p>Most advice about SMS payment collection is geared toward <a target="_blank" rel="noopener" href="https://abcfitness.com/abc-articles/gym-debt-collection/">debt collectors</a>, not gym operators. It assumes long-standing debt and hostile escalation that can end in legal action. For a fitness business, a failed payment is rarely a refusal to pay; it's usually just an expired card.</p>
<p>By sending an <a target="_blank" rel="noopener" href="https://abcfitness.com/webinars/growth-playbook-stop-chasing-start-collecting-payments-fast/">actionable payment link</a> the moment a transaction fails, you resolve the issue long before it ever becomes a debt collection problem.</p>
<p>In this article, we'll show you why SMS outperforms email when it comes to past-due payments, what makes a payment link truly "actionable," and how to build a recovery flow that preserves member loyalty while quickly resolving failed payments.</p>
<h4><strong>Table of Contents</strong></h4>
<ul>
<li>Why SMS Works Better Than Calls or Email for Failed Payments  </li>
<li>What Makes a Payment Link "Actionable"  </li>
<li>A Sample SMS Payment Collection Message Flow  </li>
<li>What Operators Should Know About Compliance  </li>
<li>FAQs: SMS Payment Collection  </li>
<li>Speed Up Recovery with Smarter SMS Payment Collection</li>
</ul>
<h4><strong>Why SMS Works Better Than Calls or Email for Failed Payments</strong></h4>
<p>SMS reminders have an <a target="_blank" rel="noopener" href="https://www.glofox.com/blog/gym-offer-messages-sample/">average open rate</a> of <strong>98%</strong>, compared to just 20% for email. Even more telling, 90% of those text messages are opened <strong>within the first three minutes</strong>.</p>
<p>The sooner you reach a member, the more likely they are to resolve a failed payment. </p>
<p>Alternative methods of communication introduce too much friction. A phone call can mean answering an unknown number, sitting through a greeting, and sorting out a payment out loud. Most people simply won't pick up. Email can mean sorting through a crowded inbox, where billing notices often land in spam.</p>
<p>A <a target="_blank" rel="noopener" href="https://abcfitness.com/abc-articles/gym-debt-collection/">payment collection SMS</a> arrives on the member's lock screen, on the device they already check constantly. An actionable link allows them to resolve the charge in seconds.</p>
<p>There's a <a target="_blank" rel="noopener" href="https://abcfitness.com/abc-articles/why-gym-members-cancel/">member experience</a> angle, too: a well-timed text reads as a helpful heads-up, not a confrontation. A helpful tone can be far easier to strike via text than on a phone call that catches someone off guard.</p>
<h4><strong>What Makes a Payment Link "Actionable"</strong></h4>
<p>A text is only as good as the resolution it provides. A message asking members to call the front desk puts the work back on them. An actionable payment link, on the other hand, lets them settle a balance instantly, directly from the message.</p>
<h5><strong>The core mechanics</strong></h5>
<p>Unlike a basic reminder, an actionable link displays a member's real-time balance and launches a one-step <a target="_blank" rel="noopener" href="https://abcfitness.com/abc-articles/commerce-billing-and-payments-in-the-fitness-industry-2025/">payment flow</a>. This eliminates the friction of opening an account portal or digging for login information. Members can securely settle their balance via card, bank transfer, or digital wallet – all directly from the message.</p>
<p>These links are personalized to each member and update in real-time, ensuring the balance shown is always accurate. The precision that comes with good SMS payment collection software is critical; displaying an outdated balance quickly erodes member trust.</p>
<h5><strong>The result</strong></h5>
<p><a target="_blank" rel="noopener" href="https://abcfitness.com/webinars/billing-that-works-as-hard-as-you/">Our pilot data</a> shows that actionable links <strong>boost failed payment recovery by 10%</strong>. While this may seem modest, the impact at scale is significant. For enterprises processing thousands of transactions every single month, recovering a fraction of these failures adds up rapidly across clubs.</p>
<p>The operational benefit is equally powerful. Every payment handled by an actionable link is one your staff doesn't have to chase. <a target="_blank" rel="noopener" href="https://abcfitness.com/abc-articles/gym-marketing-automation/">By automating the recovery process</a> with SMS payment collection software, you turn a time-consuming manual task into a seamless, automated win.</p>
<p>After moving billing to ABC Fitness, <a target="_blank" rel="noopener" href="https://abcfitness.com/customer-story/clubfitness-greensboro-optimizes-business-model-and-billing-with-abc-fitness/">ClubFitness Greensboro</a> COO Gary Castellano reported, <em>"ABC Fitness has been instrumental in eliminating in-house billing."</em> </p>
<p><strong>A Sample SMS Payment Collection Message Flow</strong></p>
<p>Here is a sample SMS payment <a target="_blank" rel="noopener" href="https://abcfitness.com/abc-articles/collections-made-easy-for-delinquent-membership-dues/">collection flow</a> you can adapt. This flow includes three reminders over the course of a week, with a slightly firmer tone as time passes.</p>
<h5><strong>The flow</strong></h5>
<p><strong>Day 0: the payment fails.</strong> Keep it friendly and assume good intent, not delinquency.</p>
<blockquote>
<p>Hi [Name], this is [Club]. Your ABC Fitness payment didn't go through. No worries, you can update it in a few seconds here: [link]. Reply STOP to opt out.</p>
</blockquote>
<p><strong>Day 2 to 3: a second reminder.</strong> Slightly more direct. The tone shifts to convey urgency.</p>
<blockquote>
<p>Hi [Name], a quick reminder that your ABC Fitness payment is still outstanding. Update it here to keep your membership active: [link]. Reply STOP to opt out.</p>
</blockquote>
<p><strong>Day 7: a final reminder before their account moves to collections.</strong> Communicate the shift, but keep it professional.</p>
<blockquote>
<p>Hi [Name], your [Club] account is now past due and will move to our standard collections process if it isn't resolved. Please resolve the failed payment here: [link]. Reply STOP to opt out.</p>
</blockquote>
<p>If the account stays unresolved after this flow, our article on <a target="_blank" rel="noopener" href="https://abcfitness.com/abc-articles/gym-debt-collection/">fair debt collection</a> walks you through the next steps.</p>
<h5><strong>Why the tone matters</strong></h5>
<p>Notice what these messages do not say. There is no "final warning," no "legal action," and no threat of credit reporting. Using those tactics would damage a relationship with a member who most likely just needs to update their card information.</p>
<p>Standard collection templates can do more harm than good at member-based clubs. Most payment collection SMS copy escalates drastically by day seven, because it was written for aged, third-party debt. For an active membership, an aggressive tone can be more alarming than the missed payment itself.  Members are far more likely to stay when they receive a <a target="_blank" rel="noopener" href="https://abcfitness.com/abc-articles/gym-member-communication/">friendly, well-communicated SMS</a>.</p>
<h4><strong>What Operators Should Know About Compliance</strong></h4>
<p>When you text members about payments, you need to navigate specific legal requirements. Understanding the difference between the two main compliance frameworks (TCPA and FDCPA) is essential to avoiding common mistakes.</p>
<h5><strong>TCPA: the rules for automated texting itself</strong></h5>
<p>The <a target="_blank" rel="noopener" href="https://en.wikipedia.org/wiki/Telephone_Consumer_Protection_Act_of_1991">Telephone Consumer Protection Act</a> (TCPA) broadly governs automated texts, regardless of the message contents. Under this act, you generally need prior consent to text a member's phone, and every message needs clear opt-out instructions, usually a simple "reply STOP." This applies to your friendly first-time reminder just as much as to any message sent later on.</p>
<p>Statutory damages run from $500 to $1,500 per violating message, which makes consent and opt-out handling essential. At scale, a mishandled <a target="_blank" rel="noopener" href="https://abcfitness.com/abc-articles/gym-member-communication/">messaging campaign</a> can quickly become a significant liability.</p>
<h5><strong>FDCPA: the rules for actual debt collection</strong></h5>
<p>The <a target="_blank" rel="noopener" href="https://www.ftc.gov/legal-library/browse/rules/fair-debt-collection-practices-act-text">Fair Debt Collection Practices Act</a> (FDCPA) is narrower. It applies specifically once an account is in genuine debt collection and, in most cases, once a third party is collecting on your behalf. A routine reminder that a current member's card was declined is <em>not</em> FDCPA territory.</p>
<p>Applying collections-level language to a simple failed payment is harsher than the situation warrants. It can also invite the assumption that FDCPA rules apply to a message that never triggered them in the first place. Keeping your early reminders clearly in "payment update" mode, not "debt collection" mode, is both better for the member and more correct from a compliance standpoint.</p>
<h5><strong>The caveat</strong></h5>
<p>This is general information, not legal advice. Compliance depends on your jurisdiction, how you collected consent, and how your systems are configured. Confirm your setup with legal counsel before launching a campaign, and choose SMS payment collection software that manages consent records and opt-outs for you.</p>
<h4><strong>FAQs: SMS Payment Collection</strong></h4>
<h5><strong>What is SMS payment collection for gyms?</strong></h5>
<p>SMS payment collection uses text messages to remind members about failed payments. By including a direct link, members can quickly update their payment method or settle their balance right from their phones. </p>
<p><strong>How do actionable payment links work in a text message?</strong></p>
<p>Members receive a secure SMS payment link that instantly displays their balance. Without the friction of a login or portal, they can settle payments via card, bank transfer, or digital wallet in less than a minute.</p>
<h5><strong>Is SMS payment collection legal?</strong></h5>
<p>Yes, when done correctly. Automated texts are governed by the TCPA, which generally requires prior consent and a clear opt-out in every message. <a target="_blank" rel="noopener" href="https://abcfitness.com/ignite/">Reputable SMS payment collection software</a> can handle consent and opt-out tracking for you. Because rules vary by location and setup, confirm your specific approach with legal counsel.</p>
<h5><strong>What does a good SMS payment collection message flow look like?</strong></h5>
<p>An effective collection flow typically consists of around three messages sent over a week. The first message assumes the missed payment was a simple oversight, the second offers a gentle nudge, and the third communicates that the account may move to the standard collections process if left unresolved. </p>
<h4><strong>Speed Up Recovery with Smarter SMS Payment Collection</strong></h4>
<p>A failed payment doesn't have to become a collections issue.</p>
<p>When you reach your members instantly via SMS with an actionable payment link, missed transactions can be resolved in seconds. This way, most failed payments never age into debt.</p>

<p>You're across the desk from a dealer comparing two F&amp;I menus. They look almost identical: same categories, similar coverage language, familiar terms. The dealer looks up and asks the question every agent has heard: "So what's the difference?"</p>
<p>For years, the answer was breadth. The idea was that more products gave customers more reasons to say yes, which meant more profit per deal. The biggest menu usually won, and that approach built many strong agencies.</p>

<h4><strong>Why a Longer Menu Isn't Always the Answer</strong></h4>
<p>If you built your agency on breadth, you built it well. A full menu earned trust because you could cover every customer who walked in.</p>
<p>Breadth still matters, of course, but it’s no longer what sets you apart. Nearly every F&amp;I administrator offers vehicle service contracts, GAP, tire and wheel, key replacement, appearance protection, and theft deterrence. Dealers expect all of this, so they no longer reward the inclusion.</p>

<p>Put three provider menus side by side. You'll likely find the same headings, in about the same order, with coverage language that reads nearly word for word.</p>
<p>Dealers notice the differences elsewhere:</p>
<ul>
<li><strong>Fit.</strong> How closely each product matches the vehicles on the lot and the customers who buy them.  </li>
<li><strong>Speed.</strong> How quickly the administrator approves a claim when a customer pulls into the service drive.  </li>

<p>At OnRamp, we deliver on all three.</p>

<p>With that much riding on every deal, fit is crucial. When a program doesn't suit the store, the dealer remembers the agent who brought it in, not just the administrator.</p>
<p>A program built around the store gives dealers a reason to stay with you and expand the partnership. Here’s what that looks like in practice.</p>
<h4><strong>What Tailored F&amp;I Products for Dealers Look Like</strong></h4>
<p>A <strong>tailored F&amp;I program</strong> is a product lineup, training plan, and pricing structure that fits one dealer's inventory, customers, and service goals. It isn’t a fixed package every store gets.</p>
<p>Flexibility is easy to promise. At <a target="_blank" rel="noopener" href="https://driveonramp.com/agents/">OnRamp</a>, we offer a full, agile suite of best-in-class F&amp;I products, designed to meet your clients’ specific needs. And when your dealers need something our catalog doesn't cover, we build that, too.</p>
<h5><strong>Start with the store, not the catalog</strong></h5>
<p>Before we talk products, we learn the store. Four questions shape everything that follows:</p>
<p><strong>What's on the lot?</strong> New, certified pre-owned, high-mileage trade-ins, or a strong lease business. Each calls for different coverage.</p>
<p><strong>Who buys there?</strong> A first-time buyer financing a used sedan needs different protection than a family leasing a new SUV every three years.</p>
<p><strong>What is the service department working toward?</strong> Retention, repair order volume, customer-pay work. Service is big business: franchised dealers wrote more than 136 million repair orders in the first half of 2026, with nearly $83 billion in service and parts sales, according to <a target="_blank" rel="noopener" href="https://www.nada.org/nada/newsdata/nada-data">NADA</a>. The right program brings those customers back to the store's own service drive.</p>
<p><strong>How many rooftops?</strong> Dealer groups rarely run identical stores. One program can set shared standards across the group, while each store keeps what fits its market.</p>
<p>Here’s how a program comes together, step by step:</p>
<ol>
<li>We learn the store: inventory, customers, service goals, and rooftops.  </li>
<li>We shape mechanical coverage around the vehicles on the lot.  </li>
<li>We match asset and ancillary coverage to the customers who buy there.  </li>

<h4><strong>Why Roadside Gets Overlooked in Dealership Customer Retention</strong></h4>
<p>Roadside comes bundled in the contract, so it’s easy to skip past. Staff rarely present it, and customers never learn that the selling dealer's service department can take their car if it ever needs a tow.</p>

<p>In many dealerships, F&amp;I discussions focus on core coverage. Roadside becomes a buried line item, and customers drive away not knowing their contract covers towing, jump starts, flat tire changes, lockouts, and fuel delivery.</p>
<p>John Michener, VP of Sales at NSD, puts it plainly: roadside is "one of those items that dealerships and agents just kind of overlook." But, he adds, "If you're utilizing roadside effectively, you're driving business to your dealership and to your customers."</p>
<p>When roadside stays in the fine print, three things get lost:</p>
<ul>
<li><strong>The customer forgets it's there.</strong> Stranded on the roadside, they don’t think to call the number on their contact.  </li>
<li><strong>The service department stays out of the story.</strong> No one tells the customer that the selling dealership can handle the repair, too.  </li>
<li><strong>You lose a talking point.</strong> Roadside is easy to explain, and it shows your dealers how complete your program is.</li>

<p><strong>The retention gap roadside can help close</strong></p>
<p>Dealers hold a natural advantage. According to <a target="_blank" rel="noopener" href="https://www.coxautoinc.com/insights/dealerships-capture-record-fixed-ops-revenue-but-lose-market-share-as-customers-drift-to-general-repair-according-to-cox-automotive-study/">Cox Automotive's 2026 Fixed Operations and Ownership Study</a>, 80% of new-car buyers say they're likely to service at the selling dealership. That loyalty pays off. Buyers who return for service are 30% more likely to buy from that dealer again, and 88% say the service experience affects whether they’ll buy there again.</p>
<p>The handoff is where the experience often falls short. The <a target="_blank" rel="noopener" href="https://www.coxautoinc.com/retail/resources/ownership-study/">Cox Automotive Ownership Study</a> shows that across all buyers, only 25% meet the service department during the purchase, and only 23% leave with a first service appointment on the calendar. </p>
<p>Cox also found that trust is the top reason consumers return to a dealer for service, and that the first visit is the tipping point: after servicing at a dealership, 89% of customers consider coming back.</p>
<p>That's the opening roadside creates. When a customer gets stuck on the side of the road, a well-handled response builds trust. With OnRamp, that call can end at your dealer's service drive, and a tow can become the first service visit that keeps the customer coming back. The OEMs already use roadside this way, but only while factory coverage lasts.</p>

<p>Factory roadside programs typically handle towing to the nearest dealer for that brand. That keeps the owner inside the brand’s network, at the moment they need help. It's a sound model, until factory coverage ends.</p>

<p>Compare two ways your dealers can reach a customer after the sale. One is a reminder postcard that arrives months later. The other is a roadside response that reaches the customer in a true moment of need. The postcard asks for attention. A well-handled roadside response earns it.</p>

<p>Factory roadside runs on its own term, such as 5 years or 60,000 miles for towing, which may end before the warranty does. Once it ends, so does the benefit and its link to the brand's dealer. Roadside included with an F&amp;I product, such as many OnRamp products, can keep help in place on that product's own terms and keep the dealer's service drive in the picture.</p>
<h5><strong>What is white label roadside assistance?</strong></h5>
<p>White label roadside assistance is roadside service that one company provides under another company's brand. The customer sees the dealership's or agency's name, while the provider runs dispatch and the service network behind the scenes.</p>
<h4><strong>Put OnRamp's Roadside Benefits to Work for Your Dealers</strong></h4>
<p>One roadside call can lead to a service visit, a loyal customer, and a future purchase. Many OnRamp products include roadside, so your dealers can start today.</p>
<p>OnRamp brings the elements that make it work: roadside built into the coverage, NSD's network of 50,000+ service providers, and the option to make your dealers priority towing centers. Your dealers bring the rest: a clear explanation at the desk, an introduction to the service department, and a team ready when a towed vehicle arrives. Together, they can turn a stressful breakdown into a returning customer.</p>
<p><strong>Talk to OnRamp about roadside benefits that are already built in, and built to bring customers back.</strong> <a target="_blank" rel="noopener" href="https://driveonramp.com/contact-us/">Contact Us</a></p></div>`},
linkedin:{tab:'linkedin',url:'kaya.exe/linkedin',h:'LinkedIn',sub:'posts written for Wordplay Creative.',
 html:`<div class="lip"><div class="lih"><span class="av">K</span><b>Kaya Carmen</b></div><p>Ever been in the grocery store and suddenly felt jealous of how witty a smoothie bottle is? No? Just me? Okay. 😅</p><p>Packaging is one of the most underrated places for a brand to express its voice. Most fill it with the legally required stuff and call it a day.</p><p>Innocent Drinks, on the other hand, treats their smoothie bottles like mini billboards.</p><p>One ingredient list included “a few small pebbles”... and further down, they admitted they’d lied about the pebbles. 🤭</p><p>On the base of the carton? “Stop looking at my bottom.”</p><p>B2B companies can take a page from the CPG world when it comes to brand voice and personality.</p><p>Onboarding emails, 404 pages, the little line under your pricing table…. These spots are usually the same from company to company, but they’re prime real estate to show off your brand’s personality.</p><p>Now stop looking at my bottom!</p></div><div class="lip"><div class="lih"><span class="av">K</span><b>Kaya Carmen</b></div><p>Quick etymology nerd moment. 👀</p><p>“Tone” comes from the Greek tonos, which originally meant a stretched, tightened string, like a lyre.</p><p>The same root gives us “monotony,” which literally means one tone. (And is now practically a synonym for boredom…)</p><p>It’s also a great way to think about brand voice vs. tone.</p><p>Your voice is the instrument. It represents the core of who your brand is, and it should remain consistent from your website to your social media posts.</p><p>Your tone is how tightly you tune the strings. Tighter and brighter for a launch announcement. Looser and calmer for a “your payment didn’t go through” email.</p><p>Mailchimp’s style guide sums it up nicely: “You have the same voice all the time, but your tone changes.”</p><p>A consistent voice keeps your brand recognizable, but never adjusting your tone leaves you sounding rigid and monotonous.</p><p>The point is to keep the same instrument, but to adjust the strings when needed.</p></div><div class="lip"><div class="lih"><span class="av">K</span><b>Kaya Carmen</b></div><p>A fast-food chain wanted to sell more milkshakes, so they asked customers what would improve them.</p><p>Thicker? More chocolatey? More whipped cream?</p><p>They made changes, but unfortunately sales didn’t budge.</p><p>So researchers working with Harvard Business professor Clayton Christensen spent a full day observing who was <em>actually</em> buying them.</p><p>It turns out, most shakes were bought first thing in the morning, by commuters.</p><p>The milkshake’s real competition? Whatever else a bored driver might grab for breakfast. Bagels (too dry). Doughnuts (crumbs all over). Bananas (gone way too fast).</p><p>Instead of a better shake, they needed better positioning. A thicker drink with chunks of fruit that lasted the whole drive. Something tasty, built for the commute, satiating enough for people who would be hungry soon but weren’t ready for a full meal.</p><p>Positioning works in the same way.👇🏼</p><p>Say you sell scheduling software to dental clinics. Your competition must be other software providers, right?</p><p>However, if you talk to enough receptionists, you’ll likely find an unexpected rival: a paper calendar and a staffer who’s “got a system.”</p><p>If your brand spends all its time talking about its huge list of integrations, you’re winning a fight nobody is having. Your messaging needs to start by answering a more important question: what happens when that receptionist goes on vacation?</p><p>That’s where great positioning starts.</p></div><div class="lip"><div class="lih"><span class="av">K</span><b>Kaya Carmen</b></div><p>The world’s most famous milk campaign came from making people miserable for a week.</p><p>In 1993, an ad agency ran a focus group about milk. The catch? Participants had to go seven days without drinking any. 🥛</p><p>Participants came back with stories about dry cereal and sad coffee. One person even admitted he’d been tempted to sneak some and just lie about it.</p><p>For years, milk marketing leaned on benefits: it contains calcium and builds strong bones. True, but people already knew this.</p><p>The focus group surfaced something even more interesting: people only really <em>notice</em> milk when it’s missing.</p><p>So “Got milk?” stopped describing the product and started describing the moment.</p><p>A list of benefits tells people what your product does — and there’s definitely a place for this in your marketing. However, describing an actual moment of need shows prospective buyers what life would feel like without your product, and how they might be worse off.</p><p>In other words, the ad makes them <em>feel</em> something.</p><p>Our research process is designed to find these angles, from client interviews to deep dives into their products or services.</p><p>Oftentimes, people are too close to their work to think of it in an unexpected or novel way. That tends to be one of the most compelling messages for your customers.</p><p>Your next best hook might be hiding in someone’s dry bowl of cereal.</p></div><div class="lip"><div class="lih"><span class="av">K</span><b>Kaya Carmen</b></div><p>When it comes to web copy, “clarify” often gets mistaken for “lobotomize”.</p><p>Many companies hide every trace of their unique voice in the name of being clear. In turn, they end up sounding just like their competitors.</p><p>Don’t get me wrong, clarity is essential. But truly effective web copy doesn’t sacrifice one for the other.</p><p>In this situation, vagueness is a bigger enemy than voice.</p><p>A tech company could say, “Optimizing omnichannel ecosystems with aggregated algorithms.”</p><p>→ Unclear, and no voice.</p><p>“We’re a flexible digital banking software.”</p><p>→ Clear. But it could be anyone.</p><p>“Tired of banking hours? Our financial services open whenever your phone does.”</p><p>→ Clear, and it sounds like someone.</p><p>Your web copy can be clear and still sound unmistakably you. In fact, it should. We can help you make it happen.</p></div><div class="lip"><div class="lih"><span class="av">K</span><b>Kaya Carmen</b></div><p>Daniel Oppenheimer, a Princeton psychologist, once published a paper titled, “Consequences of Erudite Vernacular Utilized Irrespective of Necessity.”</p><p>The subtitle helpfully translates: “Problems with Using Long Words Needlessly.” 🤣</p><p>The study found that needlessly complex writing makes readers judge an author as less intelligent.</p><p>Plenty of websites fall into this trap. “Utilize” for “use.” “Facilitate” for “help.” “Leverage” for… almost anything.</p><p>Writing with reader comprehension in mind is crucial. It tells people you care more about being clear than about sounding impressive. In turn, your confidence and expertise comes across, and you avoid the risk of sounding arrogant — or worse, alienating your readers through jargon.</p><p>Every clear word on your website works in your favour. And clarity makes you seem more intelligent, not less.</p><p>Just think back to that paper. Which title did you prefer?</p><p>If your website could use a little less ‘erudite vernacular’, we can help.</p></div><p><a class="btn" href="https://www.linkedin.com/in/kaya-carmen-7105943a6/" target="_blank" rel="noopener">see more on LinkedIn</a></p>`},
alpine:{tab:'Alpine, Texas',url:'kaya.exe/literary-fiction',h:'Alpine, Texas',sub:'a southern gothic thriller. chapter one.',
 html:`<div class="post fic"><p class="ru">Альпайн, Техас</p><p>Candied carcinogens christen the sun-soaked fields. Once lush, ripe with June’s harvest, now tainted by the ritualistic invocation of Americana. A haze of cherry-flavored jumbo drinks and crimson-stained teeth. Alpine is saccharine and rotten like a putrid, damselfly-ridden peach.</p><p>The sky is bruised, unsettling and pretty, a suburban wife caught without dinner ready. Fallen candy apples absorb ants, coating colonies in syrupy scarlet. American flags wave without a trace of guilt or irony. It’s heaven or hell, depending on who is asked.</p><p>I twirl batch after batch of cotton candy, indistinguishable from insulation stuffed between plywood beams of unfinished walls. Fluffed-up bags hang above me, marked with dainty red calligraphy, ‘Strawberry Heaven’ and ‘Blue Paradise’. Neither denomination brings sanctuary.</p><p>Luckily, the taste is of no real importance. Color takes precedence over flavor. They buy the sugar-spun wisps to feel they’ve committed the quintessential act required in order to reap the value of their day-fare wristband.</p><p>Though there is the added satisfaction of texture, of canine teeth sunk into a substance so delicate it has no choice but to cave to the jagged edges of the sharpened enamel encasing it.</p><p>Save for a few agoraphobes, nearly the entire population of Alpine swarms the blistering meadows. It’s a reunion of faded faces, once present enough to be considered recurrent, now only thought of once a year, or upon incidentally meeting their gaze through slits in slanted, yellowed blinds.</p><p>Only the bedridden pass up tickets to Alpine’s pride and joy, the Snowqueen of Texas Fair. It’s the one time of year volunteers plump up the dying wheat fields with much-needed moisture and retrieve plastic pudding cups littered on the roadside.</p><p>I can’t shake the feeling that I belong here — with blue ICEE-dyed tongues mashing aggressively under the Ferris wheel and bubblegum stuck to every surface in sight. With candy colored vomit from children who consumed too much before a coaster ride. Vomit colored vomit from adolescents who did the same with spirits.</p><p>I belong with soft serve smashed on hard pavement.</p><p>“Dasha? Is that you?” Connie Parker smiles, her teeth like mini marshmallows, perfectly white but ever so slightly too round.</p><p>Her undeniably southern voice cuts through the mumbles of consumerist children. Her cadence brings to mind sixties folk singers. I’d believe the dulcet tone was an indication of kindness if it weren’t for the fact that I know her personally.</p><p>The truth is, she would still be pretty if it weren’t for her abhorrent personality, loathsome enough to cancel out the baby blue eye-shadow and perfectly maintained eyebrows — thin, arched, seemingly sweet.</p><p>Before becoming so involved in the church, she was a beauty queen, runner-up in the ‘Snowqueen of Texas’ pageant — a fact which you only ever learn from her husband. Coming so close and falling short is what made her dedicate every Saturday and Sunday to worshipping: a distraction, a salvation, a way to believe God was the reason for everything, even her failure to win, which had nothing to do with her appearance; it had only been a lesson. Part of a bigger plan.</p><p>Connie clears her throat, demanding eye contact.</p><p>“Gosh, hardly recognized you, thought you were a… well, a nightwalker!” She laughs softly, turning to her twelve-year-old son, as if begging for a laugh. She pats the child’s shoulder. “You run off and play now.”</p><p>I force a friendly smile. I’m amused by her ability to be rude and play it off as familiarity. “Hi, Constance,” I say mechanically.</p><p>She laughs. “Listen to you! Always with the ‘Hi, Constance’, as if we aren’t practically family! Connie’ll do!” She pushes her perfectly curled hair out of her face, each strand riddled with enough hairspray to make a weeping willow curl upright. “Dasha, don’t take this the wrong way or nothin’, but, honestly, what made you think today was the day to wear lingerie out in the open?”</p><p>I smile sweetly. “They call ’em skirts, you know.”</p><p>“Oh, do they? I wasn’t aware.” She coughs a smoker’s cough. I catch a glimpse of my future, one I’ve somehow believed will never reach me.</p><p>Connie wipes her mouth with a silky handkerchief, depositing streaks of saliva and matte magenta lipstick against the gaudy floral pattern.</p><p>“Pardon me.” She smiles, having overcome the fit. “Listen, Dasha, I know your family ain’t from here, but you are. You should know that state fairs don’t negate social niceties. However exciting the occasion may be.” She nods, agreeing with herself. “Well, with a runaway mother, heaven knows I can’t expect you to know what’s alright and what isn’t. The lord meant raisin’ children to be a burden for two.” She pouts and puts her hand over her chest, feigning pangs of heartache.</p><p>I shrug. “At least my mother left me her looks, Miss. Snowqueen of Texas and all.”</p><p>She glares at me, incapable of hiding the glimmer of jealousy still radiant in her glossy brown eyes. She must’ve vowed to hate me, even as a baby.</p><p>I’m sure Constance would’ve taken the route of a life relived through her daughter, if it weren’t for the fact that she only had sons. Four, to be exact, each one a failed attempt at the recreation of her dream life. Her uterus finally gave out on her, or else I’m sure she would’ve kept rolling the dice.</p><p>“You will come by the apple stand, won’t you?” She asks, contorting her features to make them as compact as possible. She banishes the air from her nostrils, holding the walls in tight so her nose stays cute as a button. Instead of inflating to its true shape, ever so slightly bulbous, reminiscent of the one passed down from her father.</p><p>“I’ve had enough of apples, Connie.”</p><p>“Oh, but it’s for a good cause… we’re raisin’ money for the town council.” She pouts.</p><p>“Don’t you have enough by now?” I ask, serious.</p><p>“Well, look who’s thankful. Just because your father had a hand in it once doesn’t mean you have to resent the council. Same goes for the apples.”</p><p>“Had more than a hand in that, didn’t he?”</p><p>Connie smiles, bright and true. “You know, we all still can’t believe he made ’em grow. When he first moved to Alpine, I had no idea what he was sayin’. That accent, good riddance, he still hadn’t gotten rid of it. Antonovka apples… I thought he was telling me his name, for heaven’s sake. Called him Anton for about a month.” She laughs. “But he made those apples grow. What a miracle that was.”</p><p>“Believe it or not, I’ve heard the Goddamn story.” I snap.</p><p>Connie lets the polite facade leak out of her eyes, a pointed protest of the name I took in vain. A faint flicker of a smirk tells me she’s glad for the excuse to swerve in the direction we’re always headed either way.</p><p>With a newly harsh tone, more Metal than Folk, “Sure. You ought to know where your fortune came from, huh? What bought you all your … nice… clothes.” She eyes me up and down once more. “It’s not every day Siberian apples grow in West Texas, but you’ve already heard the story, huh? So why should I rehash it, then? God forgive me. And you. But that’ll be much harder.”</p><p>We listen to the cicadas wailing in the sordid heat, the shrill and disturbing chorus that eats up any gap left unfilled. I prefer the discordant swell to the topic at hand.</p><p>“You really do hate everything he’s touched, don’t you?” Connie asks, narrowing her eyes, like she’s examining an insect she can’t quite understand the foreign anatomy of.</p><p>“I try not to be hateful, but I think the truth is, yes, I do.”</p><p>She clears her throat and carries on with the admonishment, “It’s a shame. I figured you’d turn out alright, havin’ a father so committed to salvation. But given how you seem to do nothin’ but resent him, no wonder you’ve turned out to be quite his opposite. I think it’s true what they say about gut instinct.”</p><p>She nods, her lips contorting into another pout. “I held you as a baby, you know? And I thought.” She shakes her head. “Well, I wouldn’t want to scare you or nothin’, but it’s good for you to know how important it is that you keep your faith.</p><p>When I held you, Dasha, I looked into your eyes and thought, maybe some people are born with a certain darkness inside of them, the kind that didn’t come from nobody else.” Her facial expression remains pleasant, as if what she’s saying is to be expected, no more strange than ‘how bout this weather we’re having?’.</p><p>There’s no one quite like a family friend to inadvertently confirm your worst fears.</p><p>Connie reaches into her counterfeit Louis Vuitton purse with its tarnished gold chain, a picture-perfect display of her proclivity for artifice. Out comes a dainty cross necklace. Beneath layers of venomous superiority, I see an ounce of true concern within her gaze. I open my palm, almost believing it is my last hope.</p><p>She smiles and encloses my hand around the delicate silver pendant. I search her eyes for care, checking that it’s still there—</p><p>She freezes over, fuelled by her moral righteousness. She languidly pries her mouth open, as if her lips had been glued together with honey. “Your father told me he was working on your submissiveness, thank heaven for that. No one likes a headstrong woman.”</p><p>The shred of sympathy once within her fades completely, and with it, mine follows. We return to the cruel people we were to begin with.</p><p>“How’s your husband?” I ask.</p><p>She stills, weary of the topic. “Oh, you know. Same old.”</p><p>“Has he rescinded his underage-girl fantasy now that your face is all, you know… shrivelled, leathery, et cetera?”</p><p>Her uncanny smile finally reverts to its true form, the scowl to blame for her frequency wrinkles.</p><p>Biting her cheeks, her speech is muffled. The inner skin of her mouth encroaches upon her tongue. “Watch what you say about councilmen.” She seems to reach for the most hurtful words she can conjure. “And don’t act like you’ll be young forever, Dasha. Even twenty-two is too old for some. Tell your father I say hello.” She starts to wander off, in a daze of rage.</p><p>“Connie?” I call after her. She reluctantly turns, eyebrows raised, impatient. I smile a beauty queen smile. “I just wanted to say I think it’s great how you’re able to show your face at the fair. Even with the pageant.”</p><p>She spares me one last response before leaving, “Don’t go pouring your pity on me, Daria. I am lucky in my own right. Don’t pretend you haven’t noticed. Sooner or later, bad things always come to the Snowqueen.”</p><p>I wish I were more virtuous. I wish that other people’s lowness didn’t succeed at dragging me down, too, but I always feel fallen.</p><p>I look down on cruel people, but how dare I look down? I critique their debauchery from a lecherous pool of my own. I feel superior only because I know I’m bad, and they don’t seem to.</p><p>I don’t want to be this way, but I feel so contaminated. I writhe around the dirt and worms with the rest of them.</p><p>Connie wanders off in the direction of a shoddy wooden stand, Priest Prescott’s booth. Catholic capitalism. Candles for a cause. Tax-deductible, of course, but who remembers a twelve-dollar candle come tax season?</p><p>Connie greets Prescott with arms excitedly thrown open, invasive cheek kisses, and a loudly familiar, “Fatherrrrr! How the heaven are you keepin’?”</p><p class="brk">—</p><p>Babyfattened chins drip with melted Fudgsicle, the facial equivalent of a run in tights.</p><p>Sometimes half an hour goes by without a gluttonous customer. All there is to do is watch wisps from cigarettes float into the baby blue overhead, like want-to-be clouds. A passing conversation occasionally piques my interest.</p><p>Two boys, fifteen or so, sitting on a pasture fence, their legs barely long enough to touch the ground.</p><p>“Did ya hear?”</p><p>“Hear what?”</p><p>“That you’re fat and retarded.” The plump one says to the thinner one.</p><p>“Fuck you, Caid.”</p><p>“Relax, Bobby. I’m kidding. About the fat part anyway.” He almost laughs himself off the fence. “But seriously, you didn’t hear?”</p><p>“Seriously, hear what?”</p><p>“Another girl got killed. Like, 60 miles from here,” Caid says with a wicked grin, misplaced childlike whimsy, the same smile he would’ve awarded to cartoon Sundays a few years prior.</p><p>“Killed like killed killed or just killed?”</p><p>“I wasn’t aware there was a difference.”</p><p>“Like, she was hit by a fourteen-wheeler, or stabbed fourteen times?”</p><p>“Why’s it gotta be fourteen related?”</p><p>“Shut up, you know what I’m sayin’.”</p><p>“Anyway, I wouldn’t be tellin’ you about a girl getting run over, now would I? They found her on the front steps of a church. With these long nails sticking out of her. Like twenty of ’em, all over her body. With these huge gashes, you know? Craters of blood and cartilage and bone and all that.”</p><p>“Jesus.”</p><p>“Well, funny you should say that, she kinda is takin’ after our Lord and Saviour, don’tcha think?”</p><p>Bobby shrugs. “Guess so. With the nails and all. But where’s the wood?”</p><p>Caid smirks. “Careful who you ask that to. I’m not always around to protect you, ya know. You’d be surprised how many old fucks would jump at the chance to–”</p><p>“She bled out?” Bobby asks, a soft-voiced interruption.</p><p>Caid nods. “Sick, huh? Dead girls are turning up all over the place. First Nebraska, now this. It’s getting closer.” He turns to Bobby, ready for the praise he’d get for instilling fear around the campfire.</p><p>“It’s sad,” Bobby says simply, lowering his head. He aimlessly drags the toe of his shoe staccato through the dirt.</p><p class="brk">—</p><p>Priest Prescott spots me from a distance and offers a familiar wave. With Connie Parker no longer in the vicinity, I wander over. I’m thankful for the divine call to temporarily abandon my work.</p><p>“Dasha!” He smiles, friendly and earnest.</p><p>I grin. “You just had to light the candles. It isn’t hot enough already?” I joke, to his charitable chuckle.</p><p>“Well, I’m hinging on the truth of what they say about moths to flame.” He answers.</p><p>“Hoping for sinners or saints?”</p><p>“Both, of course. Always happy to have both.”</p><p>“Sinners and saints, separate? Or saintly sinners?” I ask.</p><p>“We all lean closer to the latter, don’t we?” He smiles. “While I have you here, I’ve been meaning to ask: how is your father?”</p><p>My heart drops like a free-falling elevator, cord snapped without warning. Why bring him into everything?</p><p>“He’s fine.”</p><p>“I’m glad to hear that. We all can’t help but worry sometimes. Past few years, I haven’t seen him anywhere except his porch.”</p><p>“Don’t take it personally, Father. He hardly gets out of his armchair, and when he does, it’s only ever to make his way to the fridge.”</p><p>“It is a shame he’s embraced his reclusiveness so forcefully. I know I can’t be the only one who misses his presence in church. The founders council must miss him dearly, too. Though, with an illness like his, of course we can’t place the blame on him. Least we can do is pray. Send him my best.”</p><p>“Of course.” I turn to see a growing line of fiends on the dirt mounds surrounding the candy stand. “I’ve got to get going, Priest Prescott.”</p><p>He nods, always so aggressively understanding, so much so that it nearly makes me feel guilty. Do I deserve his earnest attempt at compassion when so much of myself is intentionally compartmentalized, fragmented into separate selves, doled out carefully depending on who’s seated at the table?</p><p>“Oh, and Dasha?” He calls out, stopping me from rushing off too quickly. “Of course, I have to publicly endorse Elizabeth because she’s family,” He smiles, “But I’m rooting for you too.”</p><p>I half-scoff, almost guilty for the necessary deflation of his well wishes. “Thank you, Father, but I’m not running for Snowqueen.”</p><p>“Oh no? What with your success at prom, I thought you’d developed a taste for the crown. My mistake, Dasha. Though, come to think of it, Brynn and Constance were the ones who assured me you were running. They each seemed preoccupied by your… how can I put it… your desire to be praised?”</p><p>“Brynn and Constance said that, really? How did they phrase it?”</p><p>“I wouldn’t dare to repeat it–”</p><p>“Attention whore?” I ask. A glint in his eye betrays his vow of secrecy. “They don’t know anything about me. If they did, they’d see all I want is to be left alone.”</p><p>Priest Prescott nods, sighing gently. “They can both be quite set in their ways. Though I am of the belief that their intentions are good. Not without shreds of jealousy, of course…”</p><p>I shrug. “I can’t say I hold that same optimistic faith, Father.”</p><p>Priest Prescott smiles, getting some twisted joy out of my confession. I guess you have to, as a priest.</p><p>“I appreciate your honesty, as always.” He says.</p><p>“Even outside the booth?” I ask.</p><p>“Of course, Dasha. Especially.” He searches for the right words to comfort me. “It’s hard for women not to cast themselves in the position of adversaries, hmm? Life’s more interesting that way, with reason to sharpen your claws.”</p><p>I pout, somewhat disturbed by his viewpoint. Can’t we all chip in for some nail clippers?</p><p>“Prayer candle?” He asks simply, with a harmless smile plastered across his kind face.</p><p>“Maybe later. I don’t want to misplace it. Or worse, set the fields on fire.”</p><p>He smiles. “Very well. Can I expect you at service tomorrow morning?”</p><p>“Of course.” I say, wondering if he knows why I still come.</p><p>“Until then. Keep well, Dasha.”</p><p>“Same to you, Father.”</p><p>As I walk away, I steal a final glance at the table, registering the donation box I’d previously ignored. BEREAVED FAMILY FUND. Bitesized newspaper cut-outs, faces of pretty girls, once slathered under bolded headlines. Posed for flash-photography that’d proclaim accolades and aesthetic achievement. Surely their printed gazes couldn’t have shifted to meet the now-tragic subject matter; how then are their expressions so fitting?</p><p class="brk">—</p><p>My gaze is forcefully extracted from swirling candy gauze toward the juniper shrubs across the field. A slight slant in terrain leads to a shallow creek, an inch of muddied-water obscured and roped off by branches and dead kernels of wheat.</p><p>The color palette is off. Brown and green are to be expected, but they’re illuminated by an out-of-place white behind the brush. It’s lunar. Soft and luminescent. Something has been dumped.</p><p>I focus in on the curves, squinting to make sense of a rise here and fall there. A calf, a wrist, an elbow. Purple lightning strikes to indicate veins.</p><p>It’s a body. A few feet from the marsh, face-down in the grass. I graze carefully across the untended meadow, propelled by the morbid need to confirm what I already believe to be true. Dread tries to pull me back.</p><p>My heart sinks and pounds almost on command, as it does in cinemas when prompted by sickening violin wails. A fatty upper arm pokes out from behind the cattails, a dirt-covered knee protrudes from a scrub of lilac, a limp thigh juts out of the bluebonnets, skin so pale it’s nearly translucent.</p><p>One more step and I’ll know once and for all what’s to blame. I’ll see the root cause: the evidence of blood loss, decapitation, or drowning.</p><p>Two pale pre-teens hold each other softly. They’re still as corpses, and just as in need of a tan. Each is afraid to move – as if an inch will jostle the lover, causing them to abruptly wake from the sweaty-palmed reverie, deciding one kiss was enough.</p><p>God, they know nothing – about each other, about themselves, even. With timid touches, they try to tremble in the right places, purposefully ignoring those that are off-limits. It’s so sweet it makes me want to puke.</p><p>The boy tries a peck on the neck. The girl smiles, seeming physically unaffected but emotionally touched.</p><p>I’m afraid no one will love me with that pure, thirteen-year-old love ever again. Why would they? It’s foolish to love someone who has so much time to fall out of love with you.</p><p>There’s so much more to ask for, more still to want. Even the purest passion becomes putrescent. This must be why humanity’s greatest love stories end in tragedy. Love can only be “eternal” when it isn’t given an eternity.</p><p>How am I more affected by the sight of love than by the putrid images I conjured up?</p><p>I trudge back to the cotton candy, in an oddly clinical daze. Gaps in the hanging fluff bags prompt me to resume the monotonous task of candy-spinning. The machine whirs, unattended. I gaze down to find a trail of infectious red. Starting as raspberry ice cream swirl, it churns through various shades of lipstick. Bubblegum, Blush, Berry Kiss, and Bordeaux, before reaching its final stop: Blood.</p></div>`},
